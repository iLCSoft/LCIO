name: key4hep

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: 16 4 * * 1

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["sw.hsf.org/key4hep",
                  "sw-nightlies.hsf.org/key4hep"]
        container_os: [el9]
        include:
          - release: "sw-nightlies.hsf.org/key4hep"
            container_os: ubuntu2404
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: lcio
    - uses: cvmfs-contrib/github-action-cvmfs@72f2a8d366043978d6aebee154bc9ed321c2f2a8 # v5.6
    - uses: aidasoft/run-lcg-view@b4da52e1c5ccb70a60ad4e7216de0a90664d5849 # v6.0.2
      with:
        container: ${{ matrix.container_os }}
        view-path: /cvmfs/${{ matrix.release }}
        ccache-key: ccache-key4hep-${{ matrix.container_os }}-${{ matrix.release }}
        run: |
          STARTDIR=$(pwd)
          cd $STARTDIR/lcio
          mkdir build install
          cd build
          cmake -DCMAKE_CXX_STANDARD=20 \
            -DBUILD_ROOTDICT=ON \
            -DCMAKE_CXX_FLAGS="-fdiagnostics-color=always -Werror " \
            -DCMAKE_INSTALL_PREFIX=../install \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ..
          make -k
          ctest --output-on-failure
          make install
          echo "::group::Test downstream build"
          cd -
          export CMAKE_PREFIX_PATH=$PWD/install:$CMAKE_PREFIX_PATH
          cd tests/downstream-project-cmake-test
          mkdir build && cd build
          cmake .. -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -k
          echo "::group::Test python bindings"
          cd $STARTDIR/lcio
          cd install && source ../setup.sh
          # The installed view exposes include/, not its parent, to ROOT.
          export CPATH="${CPATH#"$LCIO:"}"
          cd ../
          rm -r $(ls | grep -v install)
          python $LCIO/python/examples/EventBuilder.py test.slcio 1
          python $LCIO/python/examples/readMCParticles.py test.slcio

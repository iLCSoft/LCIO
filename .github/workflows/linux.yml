name: linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        LCG: ["LCG_101/x86_64-centos7-gcc11-opt",
              "LCG_102/x86_64-centos7-gcc11-opt",
              "LCG_102/x86_64-centos7-clang12-opt",
              "LCG_102/x86_64-ubuntu2004-gcc9-opt"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cvmfs-contrib/github-action-cvmfs@72f2a8d366043978d6aebee154bc9ed321c2f2a8 # v5.6
    - uses: aidasoft/run-lcg-view@b4da52e1c5ccb70a60ad4e7216de0a90664d5849 # v6.0.2
      with:
        release-platform: ${{ matrix.LCG }}
        ccache-key: ccache-${{ matrix.LCG }}
        run: |
          mkdir build install
          cd build
          cmake -DCMAKE_CXX_STANDARD=17 \
            -DBUILD_ROOTDICT=ON \
            -DCMAKE_CXX_FLAGS="-fdiagnostics-color=always -Werror" \
            -DCMAKE_INSTALL_PREFIX=../install \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ..
          make -k
          ctest --output-on-failure
          make install
          echo "::group::Test downstream build"
          cd -
          export CMAKE_PREFIX_PATH=$PWD/install:$CMAKE_PREFIX_PATH
          cd tests/downstream-project-cmake-test
          mkdir build && cd build
          cmake .. -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -k
